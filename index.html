<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>Curry Empire</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Start screen -->
  <div id="start-screen">
    <div class="start-card">
      <div class="start-logo">🍛</div>
      <h1 class="start-title">CURRY EMPIRE</h1>
      <p class="start-sub">Chop. Cook. Conquer.</p>
      <div class="start-instructions">
        <div class="instr-row"><span>👆</span><span>Tap the chef to chop ingredients</span></div>
        <div class="instr-row"><span>🍲</span><span>Cook recipes to earn rupees</span></div>
        <div class="instr-row"><span>🏪</span><span>Buy kitchen stations for idle income</span></div>
        <div class="instr-row"><span>👑</span><span>Build the ultimate curry empire</span></div>
      </div>
      <button id="start-btn">Start Cooking!</button>
    </div>
  </div>

  <!-- Main game -->
  <div id="game" class="hidden">

    <header>
      <div class="hdr-left">
        <span class="hdr-logo">🍛</span>
        <span class="hdr-title">Curry Empire</span>
      </div>
      <div class="hdr-center">
        <div class="rupee-display"><span class="rupee-sym">₹</span><span id="rupee-count">0</span></div>
        <div id="rps-display"></div>
      </div>
      <div class="hdr-right">
        <button id="kitchen-btn" class="hdr-btn">🏪</button>
        <button id="music-btn" class="hdr-btn">🔇</button>
      </div>
    </header>

    <main>
      <!-- Chef click zone -->
      <section id="chef-section">
        <div id="click-zone">
          <div id="chef-emoji">👨‍🍳</div>
          <div id="click-hint">Tap to chop!</div>
        </div>
        <div id="combo-display"></div>
      </section>

      <!-- Ingredient pantry -->
      <section id="pantry-section">
        <div class="section-title">🧺 Pantry</div>
        <div id="ingredient-grid"></div>
      </section>

      <!-- Recipe menu -->
      <section id="menu-section">
        <div class="section-title">📋 Menu</div>
        <div id="recipe-list"></div>
      </section>
    </main>

    <div id="float-layer"></div>
    <div id="milestone-banner"></div>
  </div>

  <!-- Shop overlay + drawer -->
  <div id="shop-overlay" class="hidden"></div>
  <div id="shop-panel" class="hidden">
    <div class="shop-hdr">
      <h2>🏪 Kitchen</h2>
      <button id="shop-close">✕</button>
    </div>
    <div class="shop-tabs">
      <button class="tab-btn active" data-tab="stations">Stations</button>
      <button class="tab-btn" data-tab="upgrades">Upgrades</button>
    </div>
    <div id="shop-stats">
      <span>Dishes cooked: <b id="dishes-cooked">0</b></span>
      <span>Total earned: <b>₹<span id="total-earned">0</span></b></span>
    </div>
    <div id="shop-body"></div>
  </div>

  <audio id="bg-music" loop preload="none">
    <source src="https://dn710707.ca.archive.org/0/items/Punjabi_Mc_Mundian_To_Bach_Ke/Punjabi_Mc_Mundian_To_Bach_Ke.mp4" type="video/mp4">
  </audio>

  <script src="game.js"></script>
</body>
</html>
